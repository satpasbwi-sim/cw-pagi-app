<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2341">
  <title>Laporan Integritas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Integritas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <img class="emblem" src="logo.png" alt="Logo Lalu Lintas">
        <div>
          <h1>Laporan Integritas</h1>
          <p>Satlantas Polresta Banyuwangi</p>
        </div>
      </div>
      <div id="installBar" class="install" hidden>
        <img src="icon-192.png" alt="">
        <div class="install-text">
          <b>Pasang aplikasi di HP</b>
          <span id="installHint">Buka langsung dari layar utama, tanpa browser.</span>
        </div>
        <button id="btnInstall" class="btn install-btn">Pasang</button>
        <button id="btnInstallClose" class="install-close" aria-label="Tutup">×</button>
      </div>
    </div>
  </header>

  <div id="installSheet" class="ios-sheet" hidden>
    <div class="card ios-card">
      <h2 id="sheetTitle"></h2>
      <ol id="sheetSteps"></ol>
      <p id="sheetNote" class="muted"></p>
      <button id="btnSheetOk" class="btn primary block">Mengerti</button>
    </div>
  </div>

  <section id="login" class="login" hidden>
    <div class="card login-card">
      <svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2 0h6V7a3 3 0 0 0-6 0z" fill="currentColor"/></svg>
      <p class="muted">Masukkan <b>NRP</b> Anda untuk masuk.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="NRP">
      <button id="btnLogin" class="btn primary block">Masuk</button>
      <p id="loginMsg" class="msg"></p>
    </div>
  </section>

  <main id="app" hidden>
    <div class="mode" id="mode">
      <button data-m="lapor" id="btnModeLapor">Lapor CW</button>
      <button data-m="ceklok" id="btnModeCeklok" hidden>Ceklok Satpas</button>
      <button data-m="nilai" id="btnModeNilai">Nilai Saya</button>
      <button data-m="rekapInt" id="btnModeRekapInt" hidden>Rekap Integritas</button>
      <button data-m="rekap" id="btnModeRekap" hidden>Rekap Admin</button>
      <button data-m="adminMasuk" id="btnModeAdminMasuk" hidden>Admin</button>
    </div>

    <div id="laporView" hidden></div>
    <div id="ceklokView" hidden></div>
    <div id="nilaiView" hidden></div>
    <div id="rekapIntView" hidden></div>
    <div id="adminMasukView" hidden></div>

    <div id="rekapView" hidden>
    <section class="card">
      <div class="date-row">
        <button class="icon-btn" id="prevDay" aria-label="Hari sebelumnya">‹</button>
        <div class="date-mid">
          <b id="dateLabel">Memuat…</b>
          <select id="day" aria-label="Pilih tanggal"></select>
        </div>
        <button class="icon-btn" id="nextDay" aria-label="Hari berikutnya">›</button>
      </div>
      <div class="top">
        <div class="h"><b id="sumH">0</b><span>Hadir</span></div>
        <div class="t"><b id="sumT">0</b><span>Tidak hadir</span></div>
        <div class="k"><b id="sumK">0</b><span>Belum diisi</span></div>
      </div>
      <div class="top-foot">
        <span id="progress" class="muted"></span>
        <span><button id="btnReload" class="link muted-link">⟳ Muat ulang</button> · <button id="btnLogout" class="link muted-link">Keluar</button></span>
      </div>
    </section>

    <div id="simpulList"></div>

    <section class="card wa">
      <h2>Teks Laporan WhatsApp</h2>
      <label class="opt"><input type="checkbox" id="onlyTH"> Ringkas: hanya tulis yang tidak hadir / ada catatan</label>
      <textarea id="waText" rows="14" readonly></textarea>
      <div class="actions">
        <button class="btn" id="btnCopy">Salin teks</button>
        <a class="btn wa-btn" id="btnWa" target="_blank" rel="noopener">Kirim ke WhatsApp</a>
      </div>
    </section>
    </div>
  </main>

  <footer id="saveBar" class="savebar" hidden>
    <span id="saveInfo"></span>
    <button class="btn primary" id="btnSave">Simpan</button>
  </footer>
  <div id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
