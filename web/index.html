<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2341">
  <title>Laporan CW Pagi</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <svg class="emblem" viewBox="0 0 48 56" aria-hidden="true">
          <path d="M24 2 44 9v17c0 13-8.5 23-20 28C12.5 49 4 39 4 26V9z" fill="#f2b632"/>
          <path d="M24 7 39 12.5V26c0 10.5-6.6 18.6-15 22.6C15.6 44.6 9 36.5 9 26V12.5z" fill="#0f2341"/>
          <path d="m24 15 2.9 6 6.6.9-4.8 4.6 1.2 6.5L24 29.9 18.1 33l1.2-6.5-4.8-4.6 6.6-.9z" fill="#f2b632"/>
        </svg>
        <div>
          <h1>Laporan Pengaturan Pagi</h1>
          <p>Satlantas Polresta Banyuwangi</p>
        </div>
      </div>
    </div>
  </header>

  <section id="login" class="login" hidden>
    <div class="card login-card">
      <svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2 0h6V7a3 3 0 0 0-6 0z" fill="currentColor"/></svg>
      <h2>Masuk</h2>
      <p class="muted">Masukkan PIN akses untuk membuka laporan.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN akses">
      <button id="btnLogin" class="btn primary block">Masuk</button>
      <p id="loginMsg" class="msg"></p>
    </div>
  </section>

  <main id="app" hidden>
    <section class="card">
      <div class="date-row">
        <button class="icon-btn" id="prevDay" aria-label="Hari sebelumnya">‹</button>
        <div class="date-mid">
          <b id="dateLabel">Memuat…</b>
          <select id="day" aria-label="Pilih tanggal"></select>
        </div>
        <button class="icon-btn" id="nextDay" aria-label="Hari berikutnya">›</button>
      </div>
      <div class="top">
        <div class="h"><b id="sumH">0</b><span>Hadir</span></div>
        <div class="t"><b id="sumT">0</b><span>Tidak hadir</span></div>
        <div class="k"><b id="sumK">0</b><span>Belum diisi</span></div>
      </div>
      <div class="top-foot">
        <span id="progress" class="muted"></span>
        <button id="btnReload" class="link muted-link">⟳ Muat ulang</button>
      </div>
    </section>

    <div id="simpulList"></div>

    <section class="card wa">
      <h2>Teks Laporan WhatsApp</h2>
      <label class="opt"><input type="checkbox" id="onlyTH"> Ringkas: hanya tulis yang tidak hadir / ada catatan</label>
      <textarea id="waText" rows="14" readonly></textarea>
      <div class="actions">
        <button class="btn" id="btnCopy">Salin teks</button>
        <a class="btn wa-btn" id="btnWa" target="_blank" rel="noopener">Kirim ke WhatsApp</a>
      </div>
    </section>
  </main>

  <footer id="saveBar" class="savebar" hidden>
    <span id="saveInfo"></span>
    <button class="btn primary" id="btnSave">Simpan</button>
  </footer>
  <div id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
